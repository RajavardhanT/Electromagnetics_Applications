<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 680" role="img" aria-labelledby="title desc">
<title id="title">PMIC and PCB multi-rail power tree</title>
<desc id="desc">Source power through protection into a multi-output PMIC, producing processor, memory, IO and low-noise analog rails. Sequencer, power-good supervision, telemetry and PCB layout hot loops are identified.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b31"/><stop offset="1" stop-color="#102e48"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#70decf"/></marker><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b6b4f4"/></marker></defs>
<rect width="1360" height="680" rx="15" fill="url(#bg)"/>
<text x="38" y="45" fill="#f3fbff" font-family="Arial,sans-serif" font-size="29" font-weight="800">PMIC — MULTI-RAIL POWER TREE ON A PCB</text>
<text x="38" y="75" fill="#bad4e3" font-family="Arial,sans-serif" font-size="17">Voltage conversion + sequencing + monitoring + protection + power-distribution integrity</text>
<g font-family="Arial,sans-serif">
<rect x="30" y="135" width="190" height="124" rx="10" fill="#173852" stroke="#73e0d1" stroke-width="1.7"/>
<text x="125" y="178" font-size="20" fill="#eafaff" font-weight="700" text-anchor="middle">Source</text><text x="125" y="207" font-size="15" fill="#b7d8e8" text-anchor="middle">Battery / adapter</text><text x="125" y="234" font-size="14" fill="#92cbd0" text-anchor="middle">5–20 V example</text>
<path d="M220 197 H267" stroke="#70decf" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="275" y="135" width="210" height="124" rx="10" fill="#173852" stroke="#73e0d1" stroke-width="1.7"/>
<text x="380" y="175" fill="#eafaff" font-size="19" font-weight="700" text-anchor="middle">Input stage</text><text x="380" y="205" fill="#b7d8e8" font-size="14" text-anchor="middle">ESD / UVLO / fuse</text><text x="380" y="231" fill="#92cbd0" font-size="14" text-anchor="middle">Filter / power path</text>
<path d="M485 197 H522" stroke="#70decf" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="530" y="120" width="315" height="291" rx="13" fill="#173b54" stroke="#70decf" stroke-width="2"/>
<text x="688" y="151" fill="#e8fbff" font-size="23" font-weight="800" text-anchor="middle">PMIC / regulator ICs</text>
<rect x="551" y="170" width="133" height="83" rx="8" fill="#0e2a47" stroke="#77dfcb"/>
<text x="618" y="195" font-size="15.5" fill="#e8fbff" font-weight="700" text-anchor="middle">Buck rails</text><text x="618" y="218" fill="#b7d8e8" font-size="12.5" text-anchor="middle">PWM / inductors</text><text x="618" y="238" fill="#abc9db" font-size="12.5" text-anchor="middle">High efficiency</text>
<rect x="692" y="170" width="133" height="83" rx="8" fill="#0e2a47" stroke="#77dfcb"/>
<text x="759" y="195" font-size="15.5" fill="#e8fbff" font-weight="700" text-anchor="middle">LDO rails</text><text x="759" y="218" fill="#b7d8e8" font-size="12.5" text-anchor="middle">Noise-sensitive</text><text x="759" y="238" fill="#abc9db" font-size="12.5" text-anchor="middle">Dropout / PSRR</text>
<rect x="551" y="269" width="274" height="61" rx="8" fill="#1c315a" stroke="#b6b4f4"/>
<text x="688" y="291" fill="#eeedff" font-size="15" text-anchor="middle" font-weight="700">Sequencing / PGOOD / RESET</text><text x="688" y="314" fill="#d0cffa" font-size="12.5" text-anchor="middle">Enable ramps, UV/OV, fault actions</text>
<rect x="551" y="340" width="274" height="50" rx="8" fill="#1c315a" stroke="#b6b4f4"/>
<text x="688" y="360" fill="#eeedff" font-size="14" text-anchor="middle" font-weight="700">I²C / telemetry / DVS / interrupts</text><text x="688" y="379" fill="#d0cffa" font-size="12" text-anchor="middle">Voltage, current, temperature, status</text>
<path d="M845 207 H891" stroke="#70decf" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="900" y="105" width="424" height="340" rx="14" fill="#102a42" stroke="#497c92"/>
<text x="1112" y="135" fill="#f3fbff" font-size="20" font-weight="800" text-anchor="middle">PCB POWER DISTRIBUTION</text>
<rect x="919" y="155" width="387" height="61" rx="7" fill="#16445c" stroke="#62daca"/>
<text x="1112" y="178" fill="#f1faff" font-size="17" font-weight="700" text-anchor="middle">Core rail, example 0.9–1.1 V</text><text x="1112" y="200" fill="#bdd8e4" font-size="12.5" text-anchor="middle">CPU / FPGA · transient-current demand</text>
<rect x="919" y="227" width="387" height="61" rx="7" fill="#16445c" stroke="#62daca"/>
<text x="1112" y="250" fill="#f1faff" font-size="17" font-weight="700" text-anchor="middle">Memory / I/O, 1.2 / 1.8 / 3.3 V</text><text x="1112" y="272" fill="#bdd8e4" font-size="12.5" text-anchor="middle">DDR + peripheral domains · sequencing</text>
<rect x="919" y="300" width="387" height="61" rx="7" fill="#16445c" stroke="#62daca"/>
<text x="1112" y="323" fill="#f1faff" font-size="17" font-weight="700" text-anchor="middle">Quiet analog / PLL / ADC rail</text><text x="1112" y="345" fill="#bdd8e4" font-size="12.5" text-anchor="middle">Low ripple, PSRR and spur control</text>
<rect x="919" y="373" width="387" height="54" rx="7" fill="#163e58" stroke="#62daca"/>
<text x="1112" y="396" fill="#f1faff" font-size="16" font-weight="700" text-anchor="middle">Load switch / always-on sensor</text><text x="1112" y="415" fill="#bdd8e4" font-size="12.5" text-anchor="middle">Power-gating and sleep retention</text>
<path d="M688 411 V478 H1088 V447" fill="none" stroke="#b6b4f4" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow2)"/>
<text x="865" y="470" fill="#cecdf8" font-size="13" text-anchor="middle">Power-good / enable / reset coordination</text>
<rect x="30" y="505" width="1294" height="136" rx="13" fill="#152e46" stroke="#416987"/>
<text x="49" y="540" fill="#8be4d9" font-size="19" font-weight="800">PCB DESIGN CHECKS</text>
<text x="49" y="570" fill="#e1f1fb" font-size="16">1 · Small buck hot loop and switch node     2 · Kelvin feedback and return-path discipline     3 · Decoupling + PDN impedance</text>
<text x="49" y="598" fill="#e1f1fb" font-size="16">4 · Rail startup / PGOOD / brownout / shutdown     5 · Efficiency, heat, EMI, ripple and load-step validation</text>
<text x="49" y="624" fill="#abcada" font-size="13">All rail values and source voltages are illustrative; always follow the device-specific datasheets and reference design.</text>
</g></svg>