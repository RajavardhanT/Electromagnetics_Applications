<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc"><title id="title">Mobile RF to baseband and application processor — detailed signal chain</title><desc id="desc">Conceptual receiver and transmitter hardware and 5G NR processing chain, with separately grouped phone RF front end, RF transceiver, modem baseband and Android application subsystem.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#06192b"/><stop offset="1" stop-color="#142f4a"/></linearGradient></defs><rect width="1600" height="920" rx="14" fill="url(#bg)"/><text x="34" y="50" fill="#f3fcff" font-family="Arial,sans-serif" font-weight="800" font-size="32">Smartphone RF → digital modem → Snapdragon / Android</text><text x="35" y="81" fill="#a7c9dc" font-family="Arial,sans-serif" font-size="18">Two complementary chains: hardware conversion and digital communications processing</text><rect x="18" y="103" width="1564" height="225" rx="13" fill="#0b2940" stroke="#326078"/><text x="36" y="135" font-family="Arial,sans-serif" font-size="19" font-weight="800" fill="#71e8d9">DOWNLINK / RECEIVE — ELECTROMAGNETIC WAVE TO USER DATA</text><rect x="35" y="160" width="199" height="134" rx="10" fill="#173b54" stroke="#69dcca" stroke-width="1.5"/><rect x="36" y="161" width="197" height="26" rx="9" fill="#69dcca" opacity="0.17"/><text x="48" y="180" font-family="Arial,sans-serif" font-size="12.5" font-weight="800" fill="#69dcca">STAGE 1</text><text x="134.5" y="217" font-family="Arial,sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#f5fbff">Antenna + tuner</text><text x="134.5" y="242" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#c4dbe8">EM wave → port RF</text><text x="134.5" y="268" font-family="Arial,sans-serif" font-size="12.7" text-anchor="middle" fill="#94bad0">installed efficiency</text><path d="M238 228 h15" stroke="#69dcca" stroke-width="3" fill="none"/><path d="M246 221 l10 7 -10 7" stroke="#69dcca" stroke-width="2" fill="none"/><rect x="256" y="160" width="199" height="134" rx="10" fill="#173b54" stroke="#69dcca" stroke-width="1.5"/><rect x="257" y="161" width="197" height="26" rx="9" fill="#69dcca" opacity="0.17"/><text x="269" y="180" font-family="Arial,sans-serif" font-size="12.5" font-weight="800" fill="#69dcca">STAGE 2</text><text x="355.5" y="217" font-family="Arial,sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#f5fbff">BPF / duplexer</text><text x="355.5" y="242" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#c4dbe8">band selection</text><text x="355.5" y="268" font-family="Arial,sans-serif" font-size="12.7" text-anchor="middle" fill="#94bad0">TX/RX isolation</text><path d="M459 228 h15" stroke="#69dcca" stroke-width="3" fill="none"/><path d="M467 221 l10 7 -10 7" stroke="#69dcca" stroke-width="2" fill="none"/><rect x="477" y="160" width="199" height="134" rx="10" fill="#173b54" stroke="#69dcca" stroke-width="1.5"/><rect x="478" y="161" width="197" height="26" rx="9" fill="#69dcca" opacity="0.17"/><text x="490" y="180" font-family="Arial,sans-serif" font-size="12.5" font-weight="800" fill="#69dcca">STAGE 3</text><text x="576.5" y="217" font-family="Arial,sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#f5fbff">LNA + AGC</text><text x="576.5" y="242" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#c4dbe8">low noise gain</text><text x="576.5" y="268" font-family="Arial,sans-serif" font-size="12.7" text-anchor="middle" fill="#94bad0">blocker headroom</text><path d="M680 228 h15" stroke="#69dcca" stroke-width="3" fill="none"/><path d="M688 221 l10 7 -10 7" stroke="#69dcca" stroke-width="2" fill="none"/><rect x="698" y="160" width="199" height="134" rx="10" fill="#173b54" stroke="#69dcca" stroke-width="1.5"/><rect x="699" y="161" width="197" height="26" rx="9" fill="#69dcca" opacity="0.17"/><text x="711" y="180" font-family="Arial,sans-serif" font-size="12.5" font-weight="800" fill="#69dcca">STAGE 4</text><text x="797.5" y="217" font-family="Arial,sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#f5fbff">RFIC + I/Q LO</text><text x="797.5" y="242" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#c4dbe8">RF → complex BB</text><text x="797.5" y="268" font-family="Arial,sans-serif" font-size="12.7" text-anchor="middle" fill="#94bad0">mixer + PLL</text><path d="M901 228 h15" stroke="#69dcca" stroke-width="3" fill="none"/><path d="M909 221 l10 7 -10 7" stroke="#69dcca" stroke-width="2" fill="none"/><rect x="919" y="160" width="199" height="134" rx="10" fill="#173b54" stroke="#69dcca" stroke-width="1.5"/><rect x="920" y="161" width="197" height="26" rx="9" fill="#69dcca" opacity="0.17"/><text x="932" y="180" font-family="Arial,sans-serif" font-size="12.5" font-weight="800" fill="#69dcca">STAGE 5</text><text x="1018.5" y="217" font-family="Arial,sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#f5fbff">LPF / ADC</text><text x="1018.5" y="242" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#c4dbe8">I[n] and Q[n]</text><text x="1018.5" y="268" font-family="Arial,sans-serif" font-size="12.7" text-anchor="middle" fill="#94bad0">sampling + clock</text><path d="M1122 228 h15" stroke="#69dcca" stroke-width="3" fill="none"/><path d="M1130 221 l10 7 -10 7" stroke="#69dcca" stroke-width="2" fill="none"/><rect x="1140" y="160" width="199" height="134" rx="10" fill="#173b54" stroke="#69dcca" stroke-width="1.5"/><rect x="1141" y="161" width="197" height="26" rx="9" fill="#69dcca" opacity="0.17"/><text x="1153" y="180" font-family="Arial,sans-serif" font-size="12.5" font-weight="800" fill="#69dcca">STAGE 6</text><text x="1239.5" y="217" font-family="Arial,sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#f5fbff">OFDM + MIMO</text><text x="1239.5" y="242" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#c4dbe8">FFT + equalize</text><text x="1239.5" y="268" font-family="Arial,sans-serif" font-size="12.7" text-anchor="middle" fill="#94bad0">channel estimate</text><path d="M1343 228 h15" stroke="#69dcca" stroke-width="3" fill="none"/><path d="M1351 221 l10 7 -10 7" stroke="#69dcca" stroke-width="2" fill="none"/><rect x="1361" y="160" width="199" height="134" rx="10" fill="#173b54" stroke="#69dcca" stroke-width="1.5"/><rect x="1362" y="161" width="197" height="26" rx="9" fill="#69dcca" opacity="0.17"/><text x="1374" y="180" font-family="Arial,sans-serif" font-size="12.5" font-weight="800" fill="#69dcca">STAGE 7</text><text x="1460.5" y="217" font-family="Arial,sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#f5fbff">FEC / MAC + IP</text><text x="1460.5" y="242" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#c4dbe8">soft bits → packets</text><text x="1460.5" y="268" font-family="Arial,sans-serif" font-size="12.7" text-anchor="middle" fill="#94bad0">modem → Android</text><rect x="18" y="350" width="1564" height="225" rx="13" fill="#122640" stroke="#4b538a"/><text x="36" y="383" font-family="Arial,sans-serif" font-size="19" font-weight="800" fill="#d0c9ff">UPLINK / TRANSMIT — APP DATA TO RADIATED CARRIER</text><rect x="35" y="408" width="199" height="134" rx="10" fill="#173b54" stroke="#bbb8ff" stroke-width="1.5"/><rect x="36" y="409" width="197" height="26" rx="9" fill="#bbb8ff" opacity="0.17"/><text x="48" y="428" font-family="Arial,sans-serif" font-size="12.5" font-weight="800" fill="#bbb8ff">STAGE 1</text><text x="134.5" y="465" font-family="Arial,sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#f5fbff">Apps + IP</text><text x="134.5" y="490" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#c4dbe8">socket / user data</text><text x="134.5" y="516" font-family="Arial,sans-serif" font-size="12.7" text-anchor="middle" fill="#94bad0">AP → modem</text><path d="M238 476 h15" stroke="#bbb8ff" stroke-width="3" fill="none"/><path d="M246 469 l10 7 -10 7" stroke="#bbb8ff" stroke-width="2" fill="none"/><rect x="256" y="408" width="199" height="134" rx="10" fill="#173b54" stroke="#bbb8ff" stroke-width="1.5"/><rect x="257" y="409" width="197" height="26" rx="9" fill="#bbb8ff" opacity="0.17"/><text x="269" y="428" font-family="Arial,sans-serif" font-size="12.5" font-weight="800" fill="#bbb8ff">STAGE 2</text><text x="355.5" y="465" font-family="Arial,sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#f5fbff">MAC / FEC</text><text x="355.5" y="490" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#c4dbe8">grant / LDPC</text><text x="355.5" y="516" font-family="Arial,sans-serif" font-size="12.7" text-anchor="middle" fill="#94bad0">rate matching</text><path d="M459 476 h15" stroke="#bbb8ff" stroke-width="3" fill="none"/><path d="M467 469 l10 7 -10 7" stroke="#bbb8ff" stroke-width="2" fill="none"/><rect x="477" y="408" width="199" height="134" rx="10" fill="#173b54" stroke="#bbb8ff" stroke-width="1.5"/><rect x="478" y="409" width="197" height="26" rx="9" fill="#bbb8ff" opacity="0.17"/><text x="490" y="428" font-family="Arial,sans-serif" font-size="12.5" font-weight="800" fill="#bbb8ff">STAGE 3</text><text x="576.5" y="465" font-family="Arial,sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#f5fbff">OFDM modulator</text><text x="576.5" y="490" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#c4dbe8">QAM / IFFT / CP</text><text x="576.5" y="516" font-family="Arial,sans-serif" font-size="12.7" text-anchor="middle" fill="#94bad0">I/Q samples</text><path d="M680 476 h15" stroke="#bbb8ff" stroke-width="3" fill="none"/><path d="M688 469 l10 7 -10 7" stroke="#bbb8ff" stroke-width="2" fill="none"/><rect x="698" y="408" width="199" height="134" rx="10" fill="#173b54" stroke="#bbb8ff" stroke-width="1.5"/><rect x="699" y="409" width="197" height="26" rx="9" fill="#bbb8ff" opacity="0.17"/><text x="711" y="428" font-family="Arial,sans-serif" font-size="12.5" font-weight="800" fill="#bbb8ff">STAGE 4</text><text x="797.5" y="465" font-family="Arial,sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#f5fbff">DAC + BB filter</text><text x="797.5" y="490" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#c4dbe8">analog I and Q</text><text x="797.5" y="516" font-family="Arial,sans-serif" font-size="12.7" text-anchor="middle" fill="#94bad0">reconstruction</text><path d="M901 476 h15" stroke="#bbb8ff" stroke-width="3" fill="none"/><path d="M909 469 l10 7 -10 7" stroke="#bbb8ff" stroke-width="2" fill="none"/><rect x="919" y="408" width="199" height="134" rx="10" fill="#173b54" stroke="#bbb8ff" stroke-width="1.5"/><rect x="920" y="409" width="197" height="26" rx="9" fill="#bbb8ff" opacity="0.17"/><text x="932" y="428" font-family="Arial,sans-serif" font-size="12.5" font-weight="800" fill="#bbb8ff">STAGE 5</text><text x="1018.5" y="465" font-family="Arial,sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#f5fbff">RFIC + I/Q LO</text><text x="1018.5" y="490" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#c4dbe8">upconvert to RF</text><text x="1018.5" y="516" font-family="Arial,sans-serif" font-size="12.7" text-anchor="middle" fill="#94bad0">gain + synthesizer</text><path d="M1122 476 h15" stroke="#bbb8ff" stroke-width="3" fill="none"/><path d="M1130 469 l10 7 -10 7" stroke="#bbb8ff" stroke-width="2" fill="none"/><rect x="1140" y="408" width="199" height="134" rx="10" fill="#173b54" stroke="#bbb8ff" stroke-width="1.5"/><rect x="1141" y="409" width="197" height="26" rx="9" fill="#bbb8ff" opacity="0.17"/><text x="1153" y="428" font-family="Arial,sans-serif" font-size="12.5" font-weight="800" fill="#bbb8ff">STAGE 6</text><text x="1239.5" y="465" font-family="Arial,sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#f5fbff">PA + ET / BPF</text><text x="1239.5" y="490" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#c4dbe8">output efficiency</text><text x="1239.5" y="516" font-family="Arial,sans-serif" font-size="12.7" text-anchor="middle" fill="#94bad0">ACLR / EVM</text><path d="M1343 476 h15" stroke="#bbb8ff" stroke-width="3" fill="none"/><path d="M1351 469 l10 7 -10 7" stroke="#bbb8ff" stroke-width="2" fill="none"/><rect x="1361" y="408" width="199" height="134" rx="10" fill="#173b54" stroke="#bbb8ff" stroke-width="1.5"/><rect x="1362" y="409" width="197" height="26" rx="9" fill="#bbb8ff" opacity="0.17"/><text x="1374" y="428" font-family="Arial,sans-serif" font-size="12.5" font-weight="800" fill="#bbb8ff">STAGE 7</text><text x="1460.5" y="465" font-family="Arial,sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#f5fbff">Tuner + antenna</text><text x="1460.5" y="490" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#c4dbe8">radiate power</text><text x="1460.5" y="516" font-family="Arial,sans-serif" font-size="12.7" text-anchor="middle" fill="#94bad0">TRP / matching</text><rect x="18" y="599" width="1564" height="202" rx="13" fill="#10283e" stroke="#355a77"/><text x="36" y="632" font-family="Arial,sans-serif" font-size="19" font-weight="800" fill="#9ce9dd">PHYSICAL / LOGICAL PARTITIONS (PHONE MAINBOARD)</text><rect x="35" y="668" width="353" height="96" rx="10" fill="#183652" stroke="#6ea8ce" stroke-width="1.4"/><text x="211.5" y="700" font-family="Arial,sans-serif" font-weight="800" font-size="19" fill="#f2f9ff" text-anchor="middle">RFFE + antennas</text><text x="211.5" y="725" font-family="Arial,sans-serif" font-size="15" fill="#a9d6ec" text-anchor="middle">filters / PA / LNA</text><text x="211.5" y="746" font-family="Arial,sans-serif" font-size="13" fill="#bfd5e3" text-anchor="middle">switching, isolation, matching</text><rect x="440" y="668" width="353" height="96" rx="10" fill="#183652" stroke="#6ea8ce" stroke-width="1.4"/><text x="616.5" y="700" font-family="Arial,sans-serif" font-weight="800" font-size="19" fill="#f2f9ff" text-anchor="middle">RF transceiver</text><text x="616.5" y="725" font-family="Arial,sans-serif" font-size="15" fill="#a9d6ec" text-anchor="middle">mixer / PLL / ADC / DAC</text><text x="616.5" y="746" font-family="Arial,sans-serif" font-size="13" fill="#bfd5e3" text-anchor="middle">complex I/Q sampling</text><rect x="845" y="668" width="353" height="96" rx="10" fill="#183652" stroke="#6ea8ce" stroke-width="1.4"/><text x="1021.5" y="700" font-family="Arial,sans-serif" font-weight="800" font-size="19" fill="#f2f9ff" text-anchor="middle">Cellular modem</text><text x="1021.5" y="725" font-family="Arial,sans-serif" font-size="15" fill="#a9d6ec" text-anchor="middle">FFT / MIMO / LDPC / MAC</text><text x="1021.5" y="746" font-family="Arial,sans-serif" font-size="13" fill="#bfd5e3" text-anchor="middle">baseband + cellular protocols</text><rect x="1250" y="668" width="353" height="96" rx="10" fill="#183652" stroke="#6ea8ce" stroke-width="1.4"/><text x="1426.5" y="700" font-family="Arial,sans-serif" font-weight="800" font-size="19" fill="#f2f9ff" text-anchor="middle">Application SoC</text><text x="1426.5" y="725" font-family="Arial,sans-serif" font-size="15" fill="#a9d6ec" text-anchor="middle">CPU / GPU / NPU / ISP</text><text x="1426.5" y="746" font-family="Arial,sans-serif" font-size="13" fill="#bfd5e3" text-anchor="middle">Android + IP applications</text><rect x="18" y="819" width="1564" height="77" rx="11" fill="#182f47" stroke="#52758c"/><text x="35" y="851" font-family="Arial,sans-serif" font-size="17" font-weight="800" fill="#89e7d7">Important:</text><text x="145" y="851" font-family="Arial,sans-serif" font-size="16" fill="#f0f8fd">RFIC and RFFE may be companion chips. Modem and application processor can share an SoC, but are distinct compute domains.</text><text x="35" y="879" font-family="Arial,sans-serif" font-size="15" fill="#c9dfec">Diagram is a pedagogical function map; actual Qualcomm / OEM packaging, conversion and protocol hardware vary by generation and band.</text></svg>