<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">Detailed SPICE circuit simulation architecture</title><desc id="desc">Diagram with two nested workflows: schematic, netlist, semiconductor models, modified nodal analysis, nonlinear solver and analyses; followed by feedback from measurement.</desc><defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07192b"/><stop offset="1" stop-color="#152d4b"/></linearGradient></defs><rect width="1500" height="850" rx="14" fill="url(#grad)"/><text x="38" y="48" font-size="28" font-weight="800" font-family="Arial,sans-serif" fill="#f5fbff">Inside SPICE — circuit simulator numerical architecture</text><text x="38" y="80" font-size="17" font-family="Arial,sans-serif" fill="#acc9dd">Electrical connectivity + physical device equations → sparse nonlinear system → measured observables</text>
<rect x="24" y="108" width="1452" height="255" rx="14" fill="#102940" stroke="#3b677b"/><text x="42" y="141" font-size="18" font-weight="800" font-family="Arial,sans-serif" fill="#85e5d6">STEP 1 · PHYSICAL CIRCUIT MODEL</text>
<rect x="45" y="170" width="240" height="136" rx="10" fill="#173b56" stroke="#59dec8" stroke-width="1.5"/><circle cx="64" cy="189" r="12" fill="#59dec8"/><text x="64" y="193" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#0b2540" text-anchor="middle">1</text><text x="165" y="213" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f3fbff" text-anchor="middle">Topology +</text><text x="165" y="232" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f3fbff" text-anchor="middle">source</text><text x="165" y="255" font-family="Arial,sans-serif" font-size="12" fill="#b9d0e0" text-anchor="middle">RLC + branches</text>
<rect x="342" y="170" width="240" height="136" rx="10" fill="#173b56" stroke="#59dec8" stroke-width="1.5"/><circle cx="361" cy="189" r="12" fill="#59dec8"/><text x="361" y="193" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#0b2540" text-anchor="middle">2</text><text x="462" y="213" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f3fbff" text-anchor="middle">Semiconductor</text><text x="462" y="232" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f3fbff" text-anchor="middle">compact models</text><text x="462" y="255" font-family="Arial,sans-serif" font-size="12" fill="#b9d0e0" text-anchor="middle">I(V,T), Q(V,T)</text>
<rect x="640" y="170" width="240" height="136" rx="10" fill="#173b56" stroke="#59dec8" stroke-width="1.5"/><circle cx="659" cy="189" r="12" fill="#59dec8"/><text x="659" y="193" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#0b2540" text-anchor="middle">3</text><text x="760" y="213" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f3fbff" text-anchor="middle">Parasitics +</text><text x="760" y="232" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f3fbff" text-anchor="middle">reference planes</text><text x="760" y="255" font-family="Arial,sans-serif" font-size="12" fill="#b9d0e0" text-anchor="middle">ESR, ESL, S-params</text>
<rect x="936" y="170" width="240" height="136" rx="10" fill="#173b56" stroke="#59dec8" stroke-width="1.5"/><circle cx="955" cy="189" r="12" fill="#59dec8"/><text x="955" y="193" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#0b2540" text-anchor="middle">4</text><text x="1056" y="213" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f3fbff" text-anchor="middle">Model and</text><text x="1056" y="232" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f3fbff" text-anchor="middle">stimulus checks</text><text x="1056" y="255" font-family="Arial,sans-serif" font-size="12" fill="#b9d0e0" text-anchor="middle">Units + boundaries</text>
<path d="M285 237 h55 M582 237 h56 M880 237 h54" stroke="#59dec8" stroke-width="3" fill="none"/>
<rect x="24" y="392" width="1452" height="276" rx="14" fill="#14283d" stroke="#575b96"/><text x="42" y="427" font-size="18" font-weight="800" font-family="Arial,sans-serif" fill="#c2bfff">STEP 2 · MATHEMATICAL ENGINE AND ANALYSES</text>
<rect x="45" y="463" width="240" height="130" rx="10" fill="#173b56" stroke="#c2bfff" stroke-width="1.5"/><circle cx="64" cy="482" r="12" fill="#c2bfff"/><text x="64" y="486" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#0b2540" text-anchor="middle">1</text><text x="165" y="506" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f3fbff" text-anchor="middle">MNA matrices</text><text x="165" y="548" font-family="Arial,sans-serif" font-size="12" fill="#b9d0e0" text-anchor="middle">C dx/dt + Gx = b</text>
<rect x="342" y="463" width="240" height="130" rx="10" fill="#173b56" stroke="#c2bfff" stroke-width="1.5"/><circle cx="361" cy="482" r="12" fill="#c2bfff"/><text x="361" y="486" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#0b2540" text-anchor="middle">2</text><text x="462" y="506" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f3fbff" text-anchor="middle">Nonlinear</text><text x="462" y="525" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f3fbff" text-anchor="middle">Newton solver</text><text x="462" y="548" font-family="Arial,sans-serif" font-size="12" fill="#b9d0e0" text-anchor="middle">Jacobian + sparse solve</text>
<rect x="640" y="463" width="240" height="130" rx="10" fill="#173b56" stroke="#c2bfff" stroke-width="1.5"/><circle cx="659" cy="482" r="12" fill="#c2bfff"/><text x="659" y="486" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#0b2540" text-anchor="middle">3</text><text x="760" y="506" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f3fbff" text-anchor="middle">Adaptive</text><text x="760" y="525" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f3fbff" text-anchor="middle">time integration</text><text x="760" y="548" font-family="Arial,sans-serif" font-size="12" fill="#b9d0e0" text-anchor="middle">Trapezoidal / BDF</text>
<rect x="936" y="463" width="240" height="130" rx="10" fill="#173b56" stroke="#c2bfff" stroke-width="1.5"/><circle cx="955" cy="482" r="12" fill="#c2bfff"/><text x="955" y="486" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#0b2540" text-anchor="middle">4</text><text x="1056" y="506" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f3fbff" text-anchor="middle">OP / AC /</text><text x="1056" y="525" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f3fbff" text-anchor="middle">Transient / Noise</text><text x="1056" y="548" font-family="Arial,sans-serif" font-size="12" fill="#b9d0e0" text-anchor="middle">Voltage + current traces</text>
<path d="M285 528 h55 M582 528 h56 M880 528 h54" stroke="#c2bfff" stroke-width="3" fill="none"/>
<rect x="24" y="700" width="1452" height="121" rx="13" fill="#183249" stroke="#446a82"/><text x="43" y="736" fill="#85e5d6" font-family="Arial,sans-serif" font-size="19" font-weight="800">VALIDATE, DO NOT JUST SIMULATE</text><text x="43" y="771" fill="#e3f0fa" font-family="Arial,sans-serif" font-size="17">Check hand calculations, power conservation, timestep convergence, vendor I-V/C-V curves, and calibrated bench data.</text><text x="43" y="800" fill="#b7d2e2" font-family="Arial,sans-serif" font-size="15">Tools include QSPICE / LTspice / ngspice / PSpice / Spectre / HSPICE; RF harmonic balance and full-wave EM are distinct solvers.</text></svg>