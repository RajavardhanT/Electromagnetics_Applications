  <text x="124" y="112" text-anchor="middle" class="h">Fields</text>
  <text x="124" y="137" text-anchor="middle" class="s">Maxwell · sources</text>

  <rect class="b" x="292" y="82" width="138" height="80" fill="#f3f8fc" stroke="#a7c6d9"/>
