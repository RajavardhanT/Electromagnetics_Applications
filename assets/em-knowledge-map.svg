<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Electromagnetics knowledge map</title>
  <desc id="desc">A compact technical map connecting fields and Maxwell equations to waves, interactions, devices, systems, and applications, with branches to RF engineering and quantum sensing.</desc>
  <defs>
    <style>
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.h{font-size:18px;font-weight:750}.s{font-size:14px;fill:#526579}.k{font-size:12px;font-weight:800;letter-spacing:.08em}.b{rx:14;ry:14;stroke-width:1.4}.l{fill:none;stroke:#9eb0c1;stroke-width:2}.a{fill:none;stroke:#0f988a;stroke-width:2.4}.q{fill:none;stroke:#7059b3;stroke-width:2.4}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9eb0c1"/></marker>
    <marker id="arrowT" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0f988a"/></marker>
    <marker id="arrowQ" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7059b3"/></marker>
  </defs>

  <rect width="1200" height="430" rx="22" fill="#fbfdff"/>

  <text x="46" y="42" class="k" fill="#0f988a">FROM FUNDAMENTAL FIELDS TO REAL SYSTEMS</text>

