="16" font-weight="700" fill="#f3fbff" text-anchor="middle">Model library</text><text x="383" y="432" font-family="Arial,sans-serif" font-size="12" fill="#b9d0e0" text-anchor="middle">Vendor, PDK, parasitic</text><path d="M497 408 h19" fill="none" stroke="#bbc1ff" stroke-width="2.3"/><path d="M506 401 l10 7 -10 7" fill="none" stroke="#bbc1ff" stroke-width="2.3"/><rect x="520" y="347" width="218" height="122" rx="10" fill="#173b56" stroke="#bbc1ff" stroke-width="1.5"/><circle cx="539" cy="366" r="12" fill="#bbc1ff"/><text x="539" y="370" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#0b2540" text-anchor="middle">3</text><text x="629" y="390" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f3fbff" text-anchor="middle">Select analysis</text><text x="629" y="432" font-family="Arial,sans-serif" font-size="12" fill="#b9d0e0" text-anchor="middle">OP / AC / TRAN / noise</text><path d="M743 408 h19" fill="none" stroke="#bbc1ff" stroke-width="2.3"/><path d="M752 401 l10 7 -10 7" fill="none" stroke="#bbc1ff" stroke-width="2.3"/><rect x="766" y="347" width="218" height="122" rx="10" fill="#173b56" stroke="#bbc1ff" stroke-width="1.5"/><circle cx="785" cy="366" r="12" fill="#bbc1ff"/><text x="785" y="370" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#0b2540" text-anchor="middle">4</text><text x="875" y="390" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f3fbff" text-anchor="middle">Convergence check</text><text x="875" y="432" font-family="Arial,sans-serif" font-size="12" fill="#b9d0e0" text-anchor="middle">Timestep + tolerance</text><path d="M989 408 h19" fill="none" stroke="#bbc1ff" stroke-width="2.3"/><path d="M998 401 l10 7 -10 7" fill="none" stroke="#bbc1ff" stroke-width="2.3"/><rect x="1012" y="347" width="218" height="122" rx="10" fill="#173b56" stroke="#bbc1ff" stroke-width="1.5"/><circle cx="1031" cy="366" r="12" fill="#bbc1ff"/><text x="1031" y="370" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#0b2540" text-anchor="middle">5</text><text x="1121" y="390" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f3fbff" text-anchor="middle">Lab correlation</text><text x="1121" y="432" font-family="Arial,sans-serif" font-size="12" fill="#b9d0e0" text-anchor="middle">Scope, SMU and VNA</text></g><rect x="19" y="508" width="1242" height="109" rx="13" fill="#172a41" stroke="#48677e"/><text x="38" y="538" fill="#84e7d7" font-family="Arial,sans-serif" font-size="16" font-weight="800">ENGINEERING INSIGHT</text><text x="38" y="569" fill="#e5f2ff" font-family="Arial,sans-serif" font-size="15.5">Numerical convergence is not physical validation. The device model, parasitic network and excitation must be credible.</text><text x="38" y="592" fill="#d1e2ee" font-family="Arial,sans-serif" font-size="15">For RF power amplifiers or wave propagation, combine SPICE with harmonic-balance and electromagnetic simulation.</text></svg>