anchor="middle" fill="#abcada" font-size="12.2">USB-C / VIN to rails</text><path d="M744 406 h23" stroke="#bbc1ff" stroke-width="2.2" fill="none"/><path d="M757 400 l10 6 -10 6" stroke="#bbc1ff" stroke-width="2.2" fill="none"/><rect x="771" y="347" width="215" height="121" rx="11" fill="#173852" stroke="#bbc1ff" stroke-width="1.4"/><circle cx="790" cy="365" r="12" fill="#bbc1ff"/><text x="790" y="369.5" fill="#102236" font-size="12" font-weight="800" text-anchor="middle">4</text><text x="878.5" y="384" text-anchor="middle" fill="#eefaff" font-size="16.3" font-weight="650">Zephyr + Linux</text><text x="878.5" y="431" text-anchor="middle" fill="#abcada" font-size="12.2">Separate run-time domains</text><path d="M990 406 h23" stroke="#bbc1ff" stroke-width="2.2" fill="none"/><path d="M1003 400 l10 6 -10 6" stroke="#bbc1ff" stroke-width="2.2" fill="none"/><rect x="1017" y="347" width="215" height="121" rx="11" fill="#173852" stroke="#bbc1ff" stroke-width="1.4"/><circle cx="1036" cy="365" r="12" fill="#bbc1ff"/><text x="1036" y="369.5" fill="#102236" font-size="12" font-weight="800" text-anchor="middle">5</text><text x="1124.5" y="384" text-anchor="middle" fill="#eefaff" font-size="16.3" font-weight="650">Bench verification</text><text x="1124.5" y="431" text-anchor="middle" fill="#abcada" font-size="12.2">Timing, noise, EMC</text></g><rect x="19" y="508" width="1242" height="109" rx="13" fill="#172a41" stroke="#48677e"/><text x="38" y="538" fill="#84e7d7" font-family="Arial,sans-serif" font-size="16" font-weight="800">ENGINEERING INSIGHT</text><text x="38" y="568" fill="#e5f2ff" font-size="15.5" font-family="Arial,sans-serif">The UNO Q is not a 5 V GPIO UNO; analog inputs and carrier pins have distinct limits.</text></svg>