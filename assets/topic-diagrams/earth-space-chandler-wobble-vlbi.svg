ion</text><text x="1124.5" y="223" text-anchor="middle" fill="#abcada" font-size="12.2">UT1, wobble, frames</text></g><rect x="19" y="310" width="1242" height="177" rx="13" fill="#102842" stroke="#3a4f71"/><text x="35" y="334" fill="#bbc1ff" font-family="Arial,sans-serif" font-weight="800" font-size="15">IMPLEMENTATION / MEASUREMENT CHAIN</text><g font-family="Arial,sans-serif"><rect x="33" y="347" width="215" height="121" rx="11" fill="#173852" stroke="#bbc1ff" stroke-width="1.4"/><circle cx="52" cy="365" r="12" fill="#bbc1ff"/><text x="52" y="369.5" fill="#102236" font-size="12" font-weight="800" text-anchor="middle">1</text><text x="140.5" y="384" text-anchor="middle" fill="#eefaff" font-size="16.3" font-weight="650">Hydrogen maser</text><text x="140.5" y="431" text-anchor="middle" fill="#abcada" font-size="12.2">Stable station clock</text><path d="M252 406 h23" stroke="#bbc1ff" stroke-width="2.2" fill="none"/><path d="M265 400 l10 6 -10 6" stroke="#bbc1ff" stroke-width="2.2" fill="none"/><rect x="279" y="347" width="215" height="121" rx="11" fill="#173852" stroke="#bbc1ff" stroke-width="1.4"/><circle cx="298" cy="365" r="12" fill="#bbc1ff"/><text x="298" y="369.5" fill="#102236" font-size="12" font-weight="800" text-anchor="middle">2</text><text x="386.5" y="384" text-anchor="middle" fill="#eefaff" font-size="16.3" font-weight="650">VLBI receiver</text><text x="386.5" y="431" text-anchor="middle" fill="#abcada" font-size="12.2">Coherent wideband data</text><path d="M498 406 h23" stroke="#bbc1ff" stroke-width="2.2" fill="none"/><path d="M511 400 l10 6 -10 6" stroke="#bbc1ff" stroke-width="2.2" fill="none"/><rect x="525" y="347" width="215" height="121" rx="11" fill="#173852" stroke="#bbc1ff" stroke-width="1.4"/><circle cx="544" cy="365" r="12" fill="#bbc1ff"/><text x="544" y="369.5" fill="#102236" font-size="12" font-weight="800" text-anchor="middle">3</text><text x="632.5" y="384" text-anchor="middle" fill="#eefaff" font-size="16.3" font-weight="650">Correlation