<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 645" role="img" aria-labelledby="title desc"><title id="title">ADC / DAC SIGNAL CHAIN</title><desc id="desc">Original technical system diagram showing physical signal flow and engineering implementation. Sampling, quantization and reconstruction in mixed-signal systems</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071b31"/><stop offset="1" stop-color="#102f48"/></linearGradient></defs><rect width="1280" height="645" rx="16" fill="url(#bg)"/><text x="34" y="45" fill="#f4fbff" font-family="Arial,sans-serif" font-size="27" font-weight="800">ADC / DAC SIGNAL CHAIN</text><text x="34" y="76" fill="#b7d2e2" font-family="Arial,sans-serif" font-size="17">Sampling, quantization and reconstruction in mixed-signal systems</text><rect x="19" y="102" width="1242" height="177" rx="13" fill="#0c2942" stroke="#2f5b70"/><text x="35" y="126" fill="#5de1c7" font-family="Arial,sans-serif" font-weight="800" font-size="15">PHYSICAL MECHANISM / SIGNAL PATH</text><g font-family="Arial,sans-serif"><rect x="33" y="139" width="215" height="121" rx="11" fill="#173852" stroke="#5de1c7" stroke-width="1.4"/><circle cx="52" cy="157" r="12" fill="#5de1c7"/><text x="52" y="161.5" fill="#102236" font-size="12" font-weight="800" text-anchor="middle">1</text><text x="140.5" y="176" text-anchor="middle" fill="#eefaff" font-size="16.3" font-weight="650">Continuous input</text><text x="140.5" y="223" text-anchor="middle" fill="#abcada" font-size="12.2">Bandwidth + dynamic range</text><path d="M252 198 h23" stroke="#5de1c7" stroke-width="2.2" fill="none"/><path d="M265 192 l10 6 -10 6" stroke="#5de1c7" stroke-width="2.2" fill="none"/><rect x="279" y="139" width="215" height="121" rx="11" fill="#173852" stroke="#5de1c7" stroke-width="1.4"/><circle cx="298" cy="157" r="12" fill="#5de1c7"/><text x="298" y="161.5" fill="#102236" font-size="12" font-weight="800" text-anchor="middle">2</text><text x="386.5" y="176" text-anchor="middle" fill="#eefaff" font-size="16.3" font-weight="650">Anti-alias network</text><text x="386.5" y="223" text-anchor="middle" fill="#abcada" font-size="12.2">Constrain spectrum</text><path d="M498 198 h23" stroke="#5de1c7" stroke-width="2.2" fill="none"/><path d="M511 192 l10 6 -10 6" stroke="#5de1c7" stroke-width="2.2" fill="none"/><rect x="525" y="139" width="215" height="121" rx="11" fill="#173852" stroke="#5de1c7" stroke-width="1.4"/><circle cx="544" cy="157" r="12" fill="#5de1c7"/><text x="544" y="161.5" fill="#102236" font-size="12" font-weight="800" text-anchor="middle">3</text><text x="632.5" y="176" text-anchor="middle" fill="#eefaff" font-size="16.3" font-weight="650">Sampling clock</text><text x="632.5" y="223" text-anchor="middle" fill="#abcada" font-size="12.2">Time + jitter</text><path d="M744 198 h23" stroke="#5de1c7" stroke-width="2.2" fill="none"/><path d="M757 192 l10 6 -10 6" stroke="#5de1c7" stroke-width="2.2" fill="none"/><rect x="771" y="139" width="215" height="121" rx="11" fill="#173852" stroke="#5de1c7" stroke-width="1.4"/><circle cx="790" cy="157" r="12" fill="#5de1c7"/><text x="790" y="161.5" fill="#102236" font-size="12" font-weight="800" text-anchor="middle">4</text><text x="878.5" y="176" text-anchor="middle" fill="#eefaff" font-size="16.3" font-weight="650">Quantization</text><text x="878.5" y="223" text-anchor="middle" fill="#abcada" font-size="12.2">Resolution and nonlinearity</text><path d="M990 198 h23" stroke="#5de1c7" stroke-width="2.2" fill="none"/><path d="M1003 192 l10 6 -10 6" stroke="#5de1c7" stroke-width="2.2" fill="none"/><rect x="1017" y="139" width="215" height="121" rx="11" fill="#173852" stroke="#5de1c7" stroke-width="1.4"/><circle cx="1036" cy="157" r="12" fill="#5de1c7"/><text x="1036" y="161.5" fill="#102236" font-size="12" font-weight="800" text-anchor="middle">5</text><text x="1124.5" y="176" text-anchor="middle" fill="#eefaff" font-size="16.3" font-weight="650">Digital codes</text><text x="1124.5" y="2