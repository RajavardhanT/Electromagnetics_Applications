<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 645" role="img" aria-labelledby="title desc"><title id="title">SMARTPHONE RF TO DIGITAL ARCHITECTURE</title><desc id="desc">A dual signal chain: reception from antennas through RF front end, RFIC, ADC, 5G modem and application CPU; transmission in reverse with LDPC, OFDM, DAC, RF upconversion and PA. Snapdragon modem and application processor have different responsibilities.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071b31"/><stop offset="1" stop-color="#102f48"/></linearGradient></defs><rect width="1280" height="645" rx="16" fill="url(#bg)"/><text x="34" y="45" fill="#f4fbff" font-family="Arial,sans-serif" font-size="27" font-weight="800">MOBILE PHONE — RF TO DIGITAL ARCHITECTURE</text><text x="34" y="76" fill="#bad5e2" font-family="Arial,sans-serif" font-size="17">Physical antenna, RFIC and Snapdragon modem/application domains</text><rect x="19" y="102" width="1242" height="177" rx="13" fill="#0c2942" stroke="#2f5b70"/><text x="35" y="126" fill="#61ddc9" font-family="Arial,sans-serif" font-weight="800" font-size="15">DOWNLINK / RECEIVE · WAVE TO IP PACKET</text><rect x="28" y="140" width="215" height="125" rx="10" fill="#18374f" stroke="#65ddce" stroke-width="1.5"/><circle cx="46" cy="157" r="12" fill="#65ddce"/><text x="46" y="162" text-anchor="middle" font-family="Arial,sans-serif" fill="#102237" font-size="12" font-weight="800">1</text><text x="135.5" y="179" text-anchor="middle" font-family="Arial,sans-serif" fill="#f0fbff" font-size="16.5" font-weight="700">Antenna + RFFE</text><text x="135.5" y="224" text-anchor="middle" font-family="Arial,sans-serif" fill="#b5d0df" font-size="12.5">Duplexer and LNA</text><path d="M247 203 h23" stroke="#65ddce" fill="none" stroke-width="2.3"/><path d="M260 196 l10 7 -10 7" stroke="#65ddce" fill="none" stroke-width="2.3"/><rect x="274" y="140" width="215" height="125" rx="10" fill="#18374f" stroke="#65ddce" stroke-width="1.5"/><