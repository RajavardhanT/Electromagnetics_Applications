 font-weight="800">5</text><text x="1119.5" y="386" text-anchor="middle" font-family="Arial,sans-serif" fill="#f0fbff" font-size="16.5" font-weight="700">PA / filter / antenna</text><text x="1119.5" y="431" text-anchor="middle" font-family="Arial,sans-serif" fill="#b5d0df" font-size="12.5">RF signal radiated</text><rect x="19" y="508" width="1242" height="109" rx="13" fill="#172a41" stroke="#48677e"/><text x="38" y="538" fill="#85e8d9" font-family="Arial,sans-serif" font-size="16" font-weight="800">KEY HARDWARE DISTINCTION</text><text x="38" y="568" fill="#e5f2ff" font-family="Arial,sans-serif" font-size="15.5">Snapdragon modem/baseband performs radio DSP and cellular protocols. The application CPU runs Android and user apps.</text><text x="38" y="591" fill="#d7e9f6" font-family="Arial,sans-serif" font-size="15">Antennas, filters, amplifiers and RF transceiver remain distinct physical RF functions (integration varies by model).</text></svg>